name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, simplexml, mbstring
          tools: composer, cs2pr
          coverage: none

      - name: Lint all PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Validate inline_docs.xml against its schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --schema etc/inline_docs.xsd etc/inline_docs.xml

      - name: Magento Coding Standard (informational)
        continue-on-error: true
        run: |
          composer global require --no-interaction --quiet magento/magento-coding-standard
          PHPCS="$(composer global config home)/vendor/bin/phpcs"
          "$(composer global config home)/vendor/bin/phpcs" --config-set installed_paths \
            "$(composer global config home)/vendor/magento/magento-coding-standard" || true
          "$PHPCS" --standard=Magento2 --extensions=php \
            --ignore=vendor/ . --report=full || true
